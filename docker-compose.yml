version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: craftly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: craftly
      POSTGRES_PASSWORD: craftly_secret
      POSTGRES_DB: craftly_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U craftly -d craftly_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: craftly-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
